[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "admissio"
version = "0.1.0"
description = "Turn new-hire records from any HR system into ready-to-use Active Directory / LDAP accounts."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["active-directory", "ldap", "onboarding", "provisioning", "hr", "it-automation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration :: Authentication/Directory :: LDAP",
]
dependencies = [
  "ldap3>=2.9",
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
admissio = "admissio.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/admissio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # typer.Option in defaults is the Typer idiom
